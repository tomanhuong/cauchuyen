:focus-visible{outline:2px solid var(--cta);outline-offset:2px}

.act{border-left:4px solid var(--warm);background:var(--warm-bg)}

select{min-height:44px;appearance:auto;font-family:var(--label);font-size:14px}

.types{border:1px solid var(--q);background:var(--q-bg)}

.qcard{border-left:4px solid var(--accent)}

details{border-radius:12px}

.laA{border-left:3px solid var(--accent);padding:6px 10px;font-size:15.5px;background:var(--accent-bg);border-radius:0 8px 8px 0}

.lich .d.n{background:linear-gradient(135deg,var(--accent) 50%,transparent 50%);border-color:var(--accent);color:var(--ink)}

.chu-giai{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--label);font-size:11px;color:var(--ink-dim)}
.chu-giai span{display:inline-flex;align-items:center;gap:5px}
.chu-giai i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid var(--border)}

.bar{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;font-family:var(--label);font-size:11.5px;color:var(--ink-dim)}
.bar .r{height:12px;border-radius:99px;background:var(--border-soft);position:relative;overflow:hidden}

.chip-dong{font-family:var(--label);font-size:11.5px;color:var(--ink-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

// ============ 3. TIỆN ÍCH CHỮ ============
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
function nz(s) { return String(s == null ? '' : s).normalize('NFC'); }
function co(s) { return nz(s).trim() !== ''; }
function boDau(s) { return nz(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
function doanVan(s) { return nz(s).split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean); }
function json(s, mac) { if (s && typeof s === 'object') return s; try { return s ? JSON.parse(s) : mac; } catch (e) { return mac; } }
function maNgau() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function catChu(s, n) { s = nz(s).trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

// ============ 4. GIỜ VIỆT NAM (UTC+7 cố định; giờ lấy theo máy chủ, không tin giờ điện thoại) ============
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function nowMs() { return Date.now() + (S.lech || 0); }
function vnNgay(ms) { return ymd(new Date(ms + 7 * 3600000)); }
function hn() { return vnNgay(nowMs()); }
function lucVN(ms) { var d = new Date((ms || nowMs()) + 7 * 3600000); return ymd(d) + 'T' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + '+07:00'; }
function P(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }
function cong(s, n) { return ymd(new Date(P(s) + n * 86400000)); }
function soNgay(a, b) { return Math.round((P(b) - P(a)) / 86400000); }
function thu(s) { var g = new Date(P(s)).getUTCDay(); return g === 0 ? 7 : g; }
var TEN_THU = ['', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];

function dm(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : ''; }
function dmy(s) { return s ? dm(s) + '/' + s.slice(0, 4) : ''; }
function gio(iso) { var m = /T(\d{2}):(\d{2})/.exec(iso || ''); return m ? m[1] + ':' + m[2] : ''; }
function thuNamSau(s) { var k = (4 - thu(s) + 7) % 7; return cong(s, k === 0 ? 7 : k); }
function thuNamGanNhat(s) { var k = (thu(s) - 4 + 7) % 7; return cong(s, -k); }
function dauTuan(s) { return cong(s, 1 - thu(s)); }
function ngayDep(s) { return TEN_THU[thu(s)] + ' ' + dmy(s); }

    return '<div style="border-top:1px solid var(--border-soft);padding-top:8px;display:flex;flex-direction:column;gap:6px"><span class="k"><span>TRUYỆN ' + esc(b.truyen_so) + ' · ' + ({ noi_dung: 'nội dung', giai_nghia: 'giải nghĩa', loi_ban: 'lời bàn' }[b.phan] || '') + ' · ' + esc(tenTv(b.nguoi)) + '</span><span>' + nhanTt[b.trang_thai] + '</span></span>' +
      '<span class="nho">“' + esc(catChu(b.doan, 160)) + '”</span>' + (co(b.ghi_chu) ? '<span>' + esc(b.ghi_chu) + '</span>' : '') +
      '<div class="row">' + (b.link ? '<a class="link vang" href="' + esc(b.link) + '" target="_blank" rel="noopener">Mở đúng dòng ↗</a>' : '') +
      (b.trang_thai === 'moi' ? '<button type="button" class="btn nho-btn ok" data-act="doiBl" data-v="' + esc(b.id) + '" data-t="da_sua">Đã sửa</button><button type="button" class="btn nho-btn" data-act="doiBl" data-v="' + esc(b.id) + '" data-t="khong_phai_loi">Không phải lỗi</button>'
        : '<button type="button" class="btn nho-btn" data-act="doiBl" data-v="' + esc(b.id) + '" data-t="moi">Mở lại</button>') + '</div></div>';
  }).join(''));
}
ACT.khoLai = function () { taiTinhTrangKho(); };
ACT.doiBl = function (el) { goi({ action: 'doi_bao_loi', id: el.dataset.v, trangThai: el.dataset.t }, HET_GIO.lenh).then(function (r) { if (r && r.ok && el.dataset.t === 'da_sua') { S.data.cfg.KHO_SUA = String(Date.now()); } veBaoLoi(r); }); };
ACT.datTruyen = function () {
  var so = parseInt(S.v.soMoi, 10); if (!(so >= 1 && so <= SO_TRUYEN)) return ve('#kq-dat', 'Số truyện phải từ 1 đến 243.');
  hoi('Đặt hôm nay là truyện ' + so + '?', 'Đặt', function () {
    lenhQt({ action: 'dat_truyen', so: so }, '#kq-dat', function (r) { S.data.cfg.NGAY_BAT_DAU = r.ngayBatDau; LS.set('ban', S.data); bao('Cả nhóm sẽ thấy truyện ' + so + ' hôm nay.'); taiNen(); veMan(true); });
  }, 'Lịch truyện cả nhóm đổi từ hôm nay. Bài đã làm giữ nguyên. Nếu đã có người làm bài truyện hôm nay, bài đó vẫn giữ số truyện cũ.');
};
ACT.napLaiKho = function () { hoi('Nạp lại kho truyện?', 'Nạp lại', function () { napKhoTuTep(S.nguoi, function () { taiTinhTrangKho(); taiNen(); }); }, 'Chữ của 243 truyện được thay theo tệp kho-truyen.json. Bài đã làm không đổi.'); };

// --- S21 Bộ form: sửa câu chữ gợi ý, Khôi phục bản chuẩn (ST39; R16) ---
var NHOM_FORM = [
  { ten: 'Gợi ý 3D — bài Cổ học', khoa: ['qs', 'pt', 'dk'].reduce(function (a, k) { return a.concat(['goi_y', 'la', 'khong_phai', 'dat_khi'].map(function (x) { return '3d_co_hoc_' + k + '_' + x; })); }, []) },
  { ten: 'Gợi ý 3D — bài Đời sống', khoa: ['qs', 'pt', 'dk'].reduce(function (a, k) { return a.concat(['goi_y', 'la', 'khong_phai', 'dat_khi'].map(function (x) { return '3d_doi_song_' + k + '_' + x; })); }, []) },
  { ten: '7 dạng câu hỏi', khoa: DANG.reduce(function (a, d) { return a.concat(['ten', 'ly_thuyet', 'vd_co_hoc', 'vd_doi_song'].map(function (x) { return 'dang_' + d.k + '_' + x; })); }, []) },
  { ten: '4 tiêu chí tự soát câu hỏi', khoa: ['soat_mo', 'soat_mot_y', 'soat_tu_hoi_dau', 'soat_tu_khoa'] },
  { ten: 'Phiếu ghi nhận thứ Năm', khoa: ['phieu_c1_cau', 'phieu_c1_nhac', 'phieu_c2_cau', 'phieu_c2_nhac', 'phieu_c3_cau', 'phieu_c3_nhac'] },
  { ten: 'Gợi ý khi bí chuyện đời sống', khoa: ['goi_y_doi_song_viec', 'goi_y_doi_song_vat', 'goi_y_doi_song_nguoi'] }
];
var NHAN_KHOA = { goi_y: 'Câu gợi ý', la: 'Là (ví dụ)', khong_phai: 'Chứ không phải (ví dụ)', dat_khi: 'Tự chấm "Đạt" khi', ten: 'Tên dạng', ly_thuyet: 'Lý thuyết', vd_co_hoc: 'Ví dụ — truyện cổ', vd_doi_song: 'Ví dụ — đời sống', cau: 'Câu hỏi', nhac: 'Lời nhắc' };
function nhanKhoa(k) {
  var m;
  if ((m = /^3d_(co_hoc|doi_song)_(qs|pt|dk)_(.+)$/.exec(k))) return ({ qs: '1 Quan sát', pt: '2 Phân tích', dk: '3 Đúc kết' }[m[2]]) + ' · ' + NHAN_KHOA[m[3]];
  if ((m = /^dang_(.+)_(ten|ly_thuyet|vd_co_hoc|vd_doi_song)$/.exec(k))) return FORM_CHUAN['dang_' + m[1] + '_ten'] + ' · ' + NHAN_KHOA[m[2]];
  if ((m = /^phieu_c(\d)_(cau|nhac)$/.exec(k))) return 'Câu ' + m[1] + ' · ' + NHAN_KHOA[m[2]];
  return FORM_CHUAN[k] && k.indexOf('soat_') === 0 ? 'Tiêu chí' : k.indexOf('goi_y_doi_song_') === 0 ? ({ viec: 'Việc', vat: 'Vật', nguoi: 'Người' }[k.split('_').pop()]) : k;
}
MAN.form = function () {
  if (!laQt()) { S.man = 'nay'; return MAN.nay(); }
  var mo = S.tam.formMo == null ? 0 : S.tam.formMo, f = (S.data && S.data.form) || {};
  var h = '<div class="shell"><div class="top"><button type="button" class="ib" data-act="veNay" aria-label="Về Hôm nay">‹</button><span class="t">BỘ FORM</span></div>' +
    '<p class="goi-y">Sửa câu chữ gợi ý cho cả nhóm. Ô viền vàng là ô đã khác bản chuẩn. Bài đã nộp không đổi chữ (bài chỉ lưu câu trả lời).</p>';
  NHOM_FORM.forEach(function (g, i) {
    var soSua = g.khoa.filter(function (k) { return f[k] != null; }).length;
    h += '<details class="card"' + (mo === i ? ' open' : '') + ' data-nhom="' + i + '"><summary>' + esc(g.ten) + (soSua ? ' · đã sửa ' + soSua : '') + '</summary>';
    if (mo === i) g.khoa.forEach(function (k) {
      var sua = f[k] != null, val = S.v['f:' + k] != null ? S.v['f:' + k] : F(k);
      h += '<label class="o" style="margin-top:8px">' + esc(nhanKhoa(k).toUpperCase()) + '<textarea class="vua' + (sua ? ' vien-vang' : '') + '" data-f="v:f:' + k + '" maxlength="2000">' + esc(val) + '</textarea></label>' +
        '<div class="row"><button type="button" class="btn nho-btn" data-act="luuForm" data-v="' + k + '">Lưu</button>' + (sua ? '<button type="button" class="link" data-act="khoiPhucForm" data-v="' + k + '">Khôi phục bản chuẩn</button>' : '') + '<span class="nho" id="kq-' + k + '"></span></div>';
    });
    h += '</details>';
  });
  S.tam.sauVe = function () { document.querySelectorAll('details[data-nhom]').forEach(function (d) { d.addEventListener('toggle', function () { if (d.open && +d.dataset.nhom !== S.tam.formMo) { S.tam.formMo = +d.dataset.nhom; veMan(true); } }); }); };
  return h + '</div>';
};
ACT.luuForm = function (el) {
  var k = el.dataset.v, v = S.v['f:' + k]; if (v == null) return ve('#kq-' + k, 'Chưa sửa gì.');
  if (!co(v)) return ve('#kq-' + k, 'Ô trống — muốn dùng bản chuẩn thì bấm Khôi phục.');
  lenhQt({ action: 'bo_form', khoa: k, giaTri: nz(v).trim() }, '#kq-' + k, function (r) { S.data.form = r.form; LS.set('ban', S.data); delete S.v['f:' + k]; bao('Đã lưu cho cả nhóm.'); veMan(true); });
};
ACT.khoiPhucForm = function (el) {
  var k = el.dataset.v;
  hoi('Khôi phục bản chuẩn?', 'Khôi phục', function () { lenhQt({ action: 'bo_form', khoa: k, giaTri: null }, '#kq-' + k, function (r) { S.data.form = r.form; LS.set('ban', S.data); delete S.v['f:' + k]; bao('Đã khôi phục bản chuẩn.'); veMan(true); }); }, 'Chữ đã sửa của mục "' + nhanKhoa(k) + '" sẽ bị bỏ.');
};

try { batDau(); } catch (e) {
  ghiLoi('loi_hien_thi', 'batDau: ' + (e && e.message || e));
  var cuu = document.getElementById('cuu'); if (cuu) cuu.style.display = 'flex';
}
