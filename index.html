.so-lon{font-size:30px;font-weight:600;color:var(--cta);line-height:1}
.luoi2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cot{display:flex;align-items:flex-end;gap:6px;height:90px;border-bottom:1px solid var(--border-soft);padding-top:6px}
.cot div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-family:var(--label);font-size:10px;color:var(--ink-dim)}
.cot div i{width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 0 0;display:block;min-height:2px}
/* lớp phủ, thông báo */
#lop{position:fixed;inset:0;z-index:40;display:none}
#lop.mo{display:block}
#lop .nen{position:absolute;inset:0;background:rgba(5,4,20,.66)}
#lop .tam{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--navy1);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}

.cho{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px}

@keyframes xoay{to{transform:rotate(360deg)}}
#cuu{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--navy3);color:var(--ink);padding:24px;text-align:center;font-family:Georgia,serif;font-size:18px}
#cuu button{min-height:48px;padding:0 24px;border-radius:12px;background:var(--cta);color:var(--cta-ink);font-weight:700;font-size:16px;border:0}
.an{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mau-o{width:36px;height:36px;border-radius:50%;border:2px solid transparent}
.mau-o.on{border-color:var(--ink)}
.vien-vang{border-color:var(--cta)!important}
</style>

<body>
<div id="cuu" role="alert"><div>App chưa mở được.</div><div style="font-size:15px;opacity:.75">Mạng chậm hoặc trang tải chưa xong. Bấm tải lại nhé.</div><button type="button" onclick="location.reload()">TẢI LẠI</button></div>
<div id="app"><div id="man"><div class="cho"><div class="vong"></div><div>Đang mở Thế giới các câu chuyện…</div></div></div></div>
<nav id="tabbar" class="an" aria-label="Các mục chính"></nav>
<div id="lop" role="dialog" aria-modal="true"></div>
<div id="toast" aria-live="polite"><div class="in"></div></div>
<script>
'use strict';
// ============ 0. KHỐI CẤU HÌNH NHÓM (quy ước §8: nhân bản cho nhóm khác chỉ sửa khối này) ============
var TEAM = {
  APP_ID: 'the-gioi-cau-chuyen',          // phải trùng TEAM.APP_ID trong Code.gs
  TEN_APP: 'Thế giới các câu chuyện',
  API_URL: 'https://script.google.com/macros/s/AKfycbyry4_jQq_4sjzLzi3xOdindwxhgMnCR1OHODaF5773uFdl4rZC9IswN1xgsJkp-LxinA/exec',                            // dán link máy chủ (kết thúc bằng /exec) vào đây; để trống thì app hỏi link lúc mở
  STORE: 'tgcc.'                          // tiền tố bộ nhớ máy (trùng bộ canh khởi động ở đầu trang)
};
var PHIEN = '2.0.0';
var SO_TRUYEN = 243;
var HET_GIO = { ping: 12000, load: 25000, ghi: 25000, lenh: 25000 };

// ============ 1. BẢN CHUẨN CỦA BỘ FORM (R16: Sheet chỉ lưu phần Quản trị đã sửa) ============
// v2.0.0 (25/11/2026): bỏ 3D, 7 dạng câu hỏi, tự soát, tự chấm. Câu hỏi do người đọc tự viết; gợi ý câu hỏi theo truyện nằm trong kho truyện.
var FORM_CHUAN = {
  // Lời dẫn trên các bước (Claude soạn, sửa được ở ☰ › Bộ form)
  'loi_dan_hoi': 'Đọc xong, hỏi chính mình như mẫu "Viên gạch xấu": câu chuyện này chạm vào điều gì trong đời mình?',
  'loi_dan_tra_loi': 'Trả lời thật lòng, bằng chuyện của chính mình.',
  'loi_dan_bai_hoc': 'Một câu: chuyện này dạy mình điều gì?',
  // Gợi ý chung khi truyện chưa có gợi ý riêng (theo mạch "Viên gạch xấu")
  'goi_y_hoi_chung_1': 'Nhân vật nào trong truyện giống bạn nhất? Giống ở điểm nào?',
  'goi_y_hoi_chung_2': 'Câu chuyện này mang đến cho bạn bài học gì?',
  'goi_y_hoi_chung_3': 'Gần đây chuyện nào của bạn giống câu chuyện này?',
  'goi_y_hoi_chung_4': 'Hôm nay bạn sẽ làm gì khác đi nhờ câu chuyện này?',
  // Phiếu ghi nhận thứ Năm (tt: tập trung vào năng lực kể chuyện)
  'phieu_c1_cau': '🌟 Tuần này bạn ấy đã kể chuyện hiệu quả ở điểm nào?', 'phieu_c1_nhac': 'Nêu một bài cụ thể (bản kể lại, câu hỏi, câu trả lời) và vì sao nó hay.',
  'phieu_c2_cau': '🔍 Điều gì trong cách kể chuyện của bạn ấy chưa hiệu quả?', 'phieu_c2_nhac': 'Nói về bản kể, câu hỏi, câu trả lời — không phán xét con người.',
  'phieu_c3_cau': '🌱 Đề xuất bạn ấy thử điều gì khi kể chuyện tuần tới?', 'phieu_c3_nhac': 'Một việc cụ thể, làm được ngay trong tuần tới.',
  // Gợi ý khi bí chuyện đời sống (3 góc Việc / Vật / Người)
  'goi_y_doi_song_viec': 'Một VIỆC khiến mình dừng lại hôm nay', 'goi_y_doi_song_vat': 'Một VẬT khiến mình dừng lại hôm nay', 'goi_y_doi_song_nguoi': 'Một NGƯỜI khiến mình dừng lại hôm nay'
};
function tenDang() { return ''; } // v2: không còn dạng câu hỏi (dữ liệu cũ vẫn giữ cột dang)
function F(k) { var f = S.data && S.data.form; return f && f[k] != null && f[k] !== '' ? f[k] : (FORM_CHUAN[k] != null ? FORM_CHUAN[k] : ''); }

// ============ 2. TRẠNG THÁI CHUNG ============
var S = {
  man: 'cho', tab: 'nay', may: '', pw: '', nguoi: '', lech: 0,
  data: null,                                // bản lưu của lần tải gần nhất (người khác, meta, form, nhịp nhóm)
  db: { bai: {}, cau: {}, hd: {}, sao: {}, phieu: {}, on: {} },  // bản ghi của chính mình — nguồn chân lý trên máy (luật 1)
  q: [],                                     // hàng đợi ghi (R17)
  cho: {}, hen: null,                        // thay đổi đang chờ 1,5 giây
  bai: null,                                 // bài đang làm {id}
  dangGui: false, lanThu: 0, henGui: null, banLuu: false, tai: null, taiLuc: 0,
  v: {}, tam: {}, ngayVe: ''
};

// ============ 3. TIỆN ÍCH CHỮ ============
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
function nz(s) { return String(s == null ? '' : s).normalize('NFC'); }
function co(s) { return nz(s).trim() !== ''; }
function boDau(s) { return nz(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
function doanVan(s) { return nz(s).split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean); }
function json(s, mac) { if (s && typeof s === 'object') return s; try { return s ? JSON.parse(s) : mac; } catch (e) { return mac; } }
function maNgau() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function catChu(s, n) { s = nz(s).trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

// ============ 4. GIỜ VIỆT NAM (UTC+7 cố định; giờ lấy theo máy chủ, không tin giờ điện thoại) ============
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function nowMs() { return Date.now() + (S.lech || 0); }
function vnNgay(ms) { return ymd(new Date(ms + 7 * 3600000)); }
function hn() { return vnNgay(nowMs()); }
function lucVN(ms) { var d = new Date((ms || nowMs()) + 7 * 3600000); return ymd(d) + 'T' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + '+07:00'; }
function P(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }
function cong(s, n) { return ymd(new Date(P(s) + n * 86400000)); }
function soNgay(a, b) { return Math.round((P(b) - P(a)) / 86400000); }
function thu(s) { var g = new Date(P(s)).getUTCDay(); return g === 0 ? 7 : g; }
var TEN_THU = ['', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
var THU_NGAN = ['', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
function dm(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : ''; }
function dmy(s) { return s ? dm(s) + '/' + s.slice(0, 4) : ''; }
function gio(iso) { var m = /T(\d{2}):(\d{2})/.exec(iso || ''); return m ? m[1] + ':' + m[2] : ''; }
function thuNamSau(s) { var k = (4 - thu(s) + 7) % 7; return cong(s, k === 0 ? 7 : k); }
function thuNamGanNhat(s) { var k = (thu(s) - 4 + 7) % 7; return cong(s, -k); }
function dauTuan(s) { return cong(s, 1 - thu(s)); }
function ngayDep(s) { return TEN_THU[thu(s)] + ' ' + dmy(s); }

// ============ 5. BỘ NHỚ MÁY ============
var LS = {
  get: function (k, mac) { try { var v = localStorage.getItem(TEAM.STORE + k); return v == null ? mac : JSON.parse(v); } catch (e) { return mac; } },
  set: function (k, v) { try { localStorage.setItem(TEAM.STORE + k, JSON.stringify(v)); return true; } catch (e) { ghiLoi('luu_may_loi', String(e && e.message || e)); return false; } },
  del: function (k) { try { localStorage.removeItem(TEAM.STORE + k); } catch (e) { } },
  xoaHet: function () { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(TEAM.STORE) === 0) localStorage.removeItem(k); }); } catch (e) { } }
};
function luuDb() { LS.set('db', S.db); }
function luuQ() { LS.set('q', S.q.map(function (o) { return { key: o.key, bang: o.bang, row: o.row, bam: o.bam, lan: o.lan || 0 }; })); }

// ============ 6. NHẬT KÝ LỖI TRÊN MÁY (gửi lên tab Nhat_ky_loi khi có mạng) ============
function ghiLoi(loai, ghiChu, choMs) {
  try {
    var l = LS.get('loi', []);
    l.push({ luc: lucVN(Date.now()), loai: loai, cho_ms: choMs ? String(choMs) : '', may: (navigator.userAgent || '').slice(0, 110),
      kieu_mo: (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone ? 'man_hinh_chinh' : 'trinh_duyet', ghi_chu: String(ghiChu || '').slice(0, 300) });
    LS.set('loi', l.slice(-100));
  } catch (e) { }
}
function guiNhatKyLoi() {
  var l = LS.get('loi', []);
  if (!l.length || !S.pw || !S.nguoi || !S.may) return;
  goi({ action: 'ghi_loi', dong: l.slice(-40) }, HET_GIO.lenh).then(function (r) { if (r && r.ok) LS.set('loi', LS.get('loi', []).slice(l.length)); });
}

// ============ 7. GỌI MÁY CHỦ (chữ thuần, không header → không bị chặn CORS; luôn có hạn chờ) ============
function goi(body, hetGio, url) {
  var dich = url || S.may;
  if (!dich) return Promise.resolve({ ok: false, error: 'chua_co_may' });
  var b = Object.assign({}, body);
  if (b.action !== 'ping' && b.action !== 'cai_dat') { if (b.pw == null) b.pw = S.pw; if (b.nguoi == null) b.nguoi = S.nguoi; }
  var ctl = window.AbortController ? new AbortController() : null, t0 = Date.now(), xong = false;
  var hen = setTimeout(function () { if (ctl) ctl.abort(); }, hetGio || HET_GIO.lenh);
  var henLau = setTimeout(function () { if (!xong) ghiLoi('cho_lau', b.action, Date.now() - t0); }, 8000);
  return fetch(dich, { method: 'POST', body: JSON.stringify(b), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(function (res) {
      return res.text().then(function (tx) {
        if (/^\s*</.test(tx)) { ghiLoi('trang_loi_google', b.action + ' ' + res.status); return { ok: false, error: 'trang-loi', status: res.status }; }
        if (!res.ok) return { ok: false, error: 'http', status: res.status };
        try { return JSON.parse(tx); } catch (e) { return { ok: false, error: 'trang-loi' }; }
      });
    })
    .catch(function (e) {
      var het = e && e.name === 'AbortError';
      if (het) ghiLoi('het_gio', b.action, Date.now() - t0);
      return { ok: false, error: het ? 'het-gio' : 'mang' };
    })
    .then(function (r) { xong = true; clearTimeout(hen); clearTimeout(henLau); return r || { ok: false, error: 'mang' }; });
}
function loiMang(r) { return r && ['het-gio', 'mang', 'trang-loi', 'http', 'server'].indexOf(r.error) >= 0; }
function chuLoi(r) {
  var e = r && r.error;
  if (e === 'het-gio') return 'Máy chủ Google chưa trả lời kịp. Mạng chậm hoặc máy chủ đang khởi động — bấm thử lại nhé.';
  if (e === 'mang') return 'Chưa kết nối được. Kiểm tra mạng rồi thử lại nhé.';
  if (e === 'trang-loi') return 'Google trả về trang lỗi thay vì dữ liệu. Thường do lúc Triển khai chưa chọn "Người có quyền truy cập: Bất kỳ ai", hoặc link chưa phải link /exec.';
  if (e === 'http') return 'Máy chủ báo lỗi ' + (r.status || '') + '. Thử lại sau ít phút nhé.';
  if (e === 'sai_mat_khau') return 'Mật khẩu chưa đúng.';
  if (e === 'unknown_action') return 'Máy chủ chưa phải bản mới — dán Code.gs bản ' + PHIEN + ' rồi Triển khai › Phiên bản mới.';
  if (e === 'chi_quan_tri') return 'Việc này chỉ Quản trị làm được.';
  if (e === 'server') return 'Máy chủ gặp lỗi: ' + (r.message || '') + '.';
  if (e === 'chua_co_may') return 'Chưa có link máy chủ.';
  return 'Chưa làm được (' + (e || 'lỗi lạ') + ').';
}
function layLinkExec(tx) { var m = /https:\/\/script\.google\.com\/(?:a\/[^\/\s]+\/)?macros\/s\/[A-Za-z0-9_\-]+\/exec/.exec(String(tx || '')); return m ? m[0] : ''; }
function nhanThoiGian(luc) { var t = Date.parse(luc || ''); if (!isNaN(t)) { S.lech = t - Date.now(); LS.set('lech', S.lech); } }

// ============ 8. HÀNG ĐỢI GHI (R17: tuần tự, gộp theo khóa khi chưa gửi, thử lại 1 s / 2,5 s / 5 s rồi mỗi 20 s) ============
var LOI_CHAC = { thieu: 1, id_sai: 1, chi_doc: 1, khong_phai_cua_ban: 1, da_nop_roi: 1, doi_ngay: 1, loai_sai: 1, ngay_sai: 1, ngay_truyen_sai: 1,
  gia_tri_sai: 1, dang_sai: 1, can_mot_cau: 1, chuyen_sai: 1, cau_cua_minh: 1, chua_duoc_xem: 1, khong_co_cau: 1, tuan_sai: 1, chua_mo: 1, da_dong: 1,
  khong_co_phieu: 1, het_han_sua: 1, bang_la: 1, thieu_id: 1 };
function xepHang(bang, key, row) {
  var bam = nowMs();
  for (var i = 0; i < S.q.length; i++) { var o = S.q[i]; if (o.key === key && !o.gui) { Object.assign(o.row, row); o.bam = bam; luuQ(); veTrangThaiGhi(); return; } }
  S.q.push({ key: key, bang: bang, row: Object.assign({}, row), bam: bam, lan: 0 });
  luuQ(); veTrangThaiGhi();
}
function chayHang() {
  if (S.dangGui || !S.q.length || !S.pw || !S.nguoi || !S.may) return;
  clearTimeout(S.henGui); S.henGui = null;
  S.dangGui = true;
  var lo = S.q.slice(0, 40); lo.forEach(function (o) { o.gui = 1; });
  veTrangThaiGhi();
  goi({ action: 'ghi', ops: lo.map(function (o) { return { key: o.key, bang: o.bang, row: Object.assign({}, o.row, { bam_luc: o.bam }) }; }) }, HET_GIO.ghi)
    .then(function (r) {
      S.dangGui = false;
      lo.forEach(function (o) { delete o.gui; });
      if (!r || !r.ok) {
        if (r && r.error === 'sai_mat_khau') { luuQ(); veTrangThaiGhi(); return veMatKhauLai(); }
        if (r && r.error === 'nguoi_da_an') { luuQ(); return veTenBiAn(); }
        if (r && r.error === 'unknown_action') baoNhe(chuLoi(r));
        S.lanThu++; var cho = [1000, 2500, 5000][S.lanThu - 1] || 20000;
        S.henGui = setTimeout(chayHang, cho); luuQ(); veTrangThaiGhi(); return;
      }
      S.lanThu = 0;
      var theoKhoa = {}; (r.ketQua || []).forEach(function (k) { theoKhoa[k.key] = k; });
      lo.forEach(function (o) {
        var k = theoKhoa[o.key]; if (!k) return;
        if (k.ok) { boKhoiHang(o); nhanDongMayChu(o, k.row); return; }
        if (LOI_CHAC[k.loi] || (o.lan = (o.lan || 0) + 1) > 4) { boKhoiHang(o); xuLyGhiHong(o, k); }
      });
      luuQ(); luuDb(); veTrangThaiGhi();
      if (S.q.length) S.henGui = setTimeout(chayHang, S.q.some(function (o) { return o.lan; }) ? 2500 : 30);
      else sauKhiHangTrong();
    });
}
function boKhoiHang(o) { var i = S.q.indexOf(o); if (i >= 0) S.q.splice(i, 1); }
function conTrongHang(tienTo) { return S.q.some(function (o) { return o.key.indexOf(tienTo) === 0; }); }
function nhanDongMayChu(o, row) { // chỉ nhận phần máy chủ quyết; không ghi đè chữ đang gõ (luật 1, 2)
  if (!row) return;
  if (o.bang === 'E3') { var b = S.db.bai[row.id]; if (b) ['trang_thai', 'nop_luc', 'truyen_so', 'ngay_truyen', 'ngay', 'lam_bu', 'them', 'che_do_xem'].forEach(function (k) { if (row[k] != null && !(k === 'che_do_xem' && conTrongHang('E3:' + row.id))) b[k] = row[k]; }); }
  else if (o.bang === 'E5') { var h = S.db.hd[row.id]; if (h) { h.ngay_dat = row.ngay_dat; if (!conTrongHang('E5:' + row.id)) { h.trang_thai = row.trang_thai; h.danh_dau_luc = row.danh_dau_luc; } } }
